name: glen-canopies
region: lon

alerts:
  - rule: DEPLOYMENT_FAILED
  - rule: DOMAIN_FAILED

services:
  - name: web
    github:
      repo: your-github-username/your-repo-name
      branch: main
      deploy_on_push: true
    source_dir: /
    environment_slug: node-js
    instance_count: 1
    instance_size_slug: basic-xxs
    http_port: 8080
    build_command: npm ci && npm run build
    run_command: npm run start -- --hostname 0.0.0.0 --port 8080
    health_check:
      http_path: /
      initial_delay_seconds: 15
      period_seconds: 30
      timeout_seconds: 5
      success_threshold: 1
      failure_threshold: 5
    envs:
      - key: NEXT_PUBLIC_SITE_URL
        scope: RUN_AND_BUILD_TIME
        type: GENERAL
        value: https://www.your-domain.com
      - key: NEXT_PUBLIC_BUSINESS_PHONE
        scope: RUN_AND_BUILD_TIME
        type: GENERAL
        value: "07833933639"
      - key: NEXT_PUBLIC_BUSINESS_EMAIL
        scope: RUN_AND_BUILD_TIME
        type: GENERAL
        value: thomas@glencanopies.com
      - key: NEXT_PUBLIC_FACEBOOK_URL
        scope: RUN_AND_BUILD_TIME
        type: GENERAL
        value: https://www.facebook.com/glen.canopys
      - key: NEXT_PUBLIC_PLAUSIBLE_DOMAIN
        scope: RUN_AND_BUILD_TIME
        type: GENERAL
        value: ""
      - key: SPIFFY_DATASET_URL
        scope: RUN_AND_BUILD_TIME
        type: SECRET
        value: REPLACE_WITH_SPIFFY_DATASET_URL
      - key: SPIFFY_ALLOWED_IMAGE_HOSTS
        scope: RUN_AND_BUILD_TIME
        type: GENERAL
        value: .fbcdn.net
      - key: APIFY_TESTIMONIALS_DATASET_URL
        scope: RUN_AND_BUILD_TIME
        type: SECRET
        value: REPLACE_WITH_APIFY_TESTIMONIALS_DATASET_URL
      - key: RESEND_API_KEY
        scope: RUN_AND_BUILD_TIME
        type: SECRET
        value: REPLACE_WITH_RESEND_API_KEY
      - key: QUOTE_FROM_EMAIL
        scope: RUN_AND_BUILD_TIME
        type: GENERAL
        value: REPLACE_WITH_QUOTE_FROM_EMAIL
      - key: QUOTE_TO_EMAIL
        scope: RUN_AND_BUILD_TIME
        type: GENERAL
        value: thomas@glencanopies.com
      - key: REVALIDATE_SECRET
        scope: RUN_AND_BUILD_TIME
        type: SECRET
        value: REPLACE_WITH_REVALIDATE_SECRET
